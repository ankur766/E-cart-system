<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cart - My Orders</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="cart.html">My Cart</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li class="profile"><a href="profile.html"><span id="username"></span> <img src="images/profile-icon.png" alt="Profile" class="profile-icon"></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>My Orders</h1>
        <div class="search">
            <select id="orderStatusFilter">
                <option value="all">All Orders</option>
                <option value="confirmed">Confirmed</option>
                <option value="transit">In Transit</option>
                <option value="delivered">Delivered</option>
                <option value="cancelled">Cancelled</option>
            </select>
            <button id="applyFilter" class="btn-primary">Apply</button>
        </div>
        
        <div class="order-section">
            <h2>Order Summary</h2>
            <table class="order-table" id="ordersTable">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Date</th>
                        <th>Items</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Orders will be loaded here -->
                </tbody>
            </table>
        </div>
        
        <div id="orderDetailsModal" class="modal hidden">
            <div class="modal-content">
                <span class="close-modal">&times;</span>
                <h2 id="modalOrderId"></h2>
                <div class="order-details">
                    <p><strong>Order Date:</strong> <span id="modalOrderDate"></span></p>
                    <p><strong>Status:</strong> <span id="modalOrderStatus" class="order-status"></span></p>
                    <p><strong>Delivery Address:</strong> <span id="modalOrderAddress"></span></p>
                    
                    <h3>Items</h3>
                    <table class="order-table">
                        <thead>
                            <tr>
                                <th>Product</th>
                                <th>Price</th>
                                <th>Quantity</th>
                                <th>Total</th>
                            </tr>
                        </thead>
                        <tbody id="modalOrderItems">
                            <!-- Order items will be loaded here -->
                        </tbody>
                    </table>
                    
                    <div class="order-actions">
                        <button id="cancelOrderBtn" class="btn btn-danger">Cancel Order</button>
                        <button id="updateAddressBtn" class="btn btn-secondary">Update Address</button>
                        <button id="returnOrderBtn" class="btn btn-warning">Return Order</button>
                        <button id="leaveFeedbackBtn" class="btn btn-success">Leave Feedback</button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script src="js/orders.js"></script>
</body>
</html>
