<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cart - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="cart.html">My Cart</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li class="profile"><a href="profile.html">Welcome <span id="username"></span> <img src="images/profile-icon.png" alt="Profile"></a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>My Profile</h1>
        <div class="profile-details">
            <p><strong>Name:</strong> <span id="profileName"></span></p>
            <p><strong>Customer ID:</strong> <span id="profileCustomerId"></span></p>
            <p><strong>Email ID:</strong> <span id="profileEmail"></span></p>
            <button id="updatePassword" class="btn">Update Password</button>
            <button id="signout" class="btn">Sign Out</button>
        </div>
        <div id="passwordUpdateForm" class="hidden">
            <h2>Update Password</h2>
            <div class="form-group">
                <label for="currentPassword">Current Password:</label>
                <input type="password" id="currentPassword" required>
            </div>
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" minlength="10" maxlength="30" required>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password:</label>
                <input type="password" id="confirmPassword" minlength="10" maxlength="30" required>
            </div>
            <button id="submitPasswordUpdate" class="btn">Update</button>
            <button id="cancelPasswordUpdate" class="btn">Cancel</button>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
