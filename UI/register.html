<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Cart - Registration</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Registration</h1>
    </header>
    <main>
        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" maxlength="50" required>
                <small class="form-text">Maximum 50 characters</small>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" required>
                <small class="form-text">We'll never share your email</small>
            </div>
            <div class="form-group">
                <label for="address">Delivery Address:</label>
                <textarea id="address" maxlength="100" required></textarea>
                <small class="form-text">Maximum 100 characters</small>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" minlength="10" maxlength="30" required  >
                
                <small class="form-text">10-30 characters</small>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm Password:</label>
                <input type="password" id="confirmPassword" required>
            </div>
            <div class="form-group">
                <button type="submit" class="btn btn-primary" id="registerBtn">Register</button>
            </div>
        </form>
        <div class="login-link">
            <p>Already have an account? <a href="login.html" class="text-link">Login here</a></p>
        </div>
        <div id="acknowledgment" class="hidden">
            <div class="success-card">
                <h2>🎉 Registration Successful!</h2>
                <div class="success-details">
                    <p><strong>Customer ID:</strong> <span id="customerId"></span></p>
                    <p><strong>Name:</strong> <span id="customerName"></span></p>
                    <p><strong>Email:</strong> <span id="customerEmail"></span></p>
                </div>
                <a href="login.html" class="btn btn-success">Proceed to Login</a>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
